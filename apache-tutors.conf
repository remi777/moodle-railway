# Ładne URL-e dla stron tutorów.
<Directory /var/www/html/public>
    RewriteEngine On
    # /tutorzy → katalog
    RewriteRule ^tutorzy/?$ /local/over30tutors/index.php [L,QSA]
    # /tutor/<slug> → strona tutora
    RewriteRule ^tutor/([^/]+)/?$ /local/over30tutors/tutor.php?slug=$1 [L,QSA]
</Directory>
